name: Release
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      action:
        description: Release operation
        type: choice
        options: [start, publish]
        required: true
      version:
        description: 'Start: final version, e.g. 0.3.0'
        type: string
      commit:
        description: 'Start: full main SHA (blank means main at dispatch)'
        type: string
      candidate:
        description: 'Publish: accepted candidate tag, e.g. v0.3.0rc2'
        type: string
      qa-evidence:
        description: 'Publish: QA acceptance HTTPS URL for this candidate'
        type: string
      ready:
        description: 'Publish: engineering ready, blockers resolved, product ready if applicable'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: compass-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      branch: ${{ steps.plan.outputs.branch }}
      version: ${{ steps.plan.outputs.version }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: true
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          CANDIDATE: ${{ inputs.candidate }}
          QA_EVIDENCE: ${{ inputs.qa-evidence }}
          READY: ${{ inputs.ready }}
        run: python3 tools/release.py plan
  validate:
    needs: plan
    uses: ./.github/workflows/ci.yaml
    with:
      release-ref: ${{ needs.plan.outputs.source }}
      release-version: ${{ needs.plan.outputs.version }}
  draft-release:
    name: Store validated artifacts and publish when requested
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Verify and store artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.validate.outputs.commit }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          ACTION: ${{ needs.plan.outputs.action }}
          CANDIDATE: ${{ inputs.candidate }}
          QA_EVIDENCE: ${{ inputs.qa-evidence }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 tools/release.py finish

  stage-ngc:
    name: Stage SDK wheel in NGC
    needs: [plan, validate, draft-release]
    if: needs.plan.outputs.action != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist

      - name: Verify release artifacts
        id: artifacts
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          wheels=(*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Install NGC CLI
        env:
          NGC_CLI_URL: https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/4.36.6/files/ngccli_linux.zip
          NGC_CLI_SHA256: 2972dbe54e80cedae18e82923a9a67a60aef23d041c5790336f8f4b51752bab6
        run: |
          curl --fail --location --silent --show-error "$NGC_CLI_URL" --output "$RUNNER_TEMP/ngccli.zip"
          echo "$NGC_CLI_SHA256  $RUNNER_TEMP/ngccli.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/ngccli.zip" -d "$RUNNER_TEMP/ngc"
          chmod +x "$RUNNER_TEMP/ngc/ngc-cli/ngc"
          echo "$RUNNER_TEMP/ngc/ngc-cli" >> "$GITHUB_PATH"

      - name: Upload SDK wheel to NGC
        env:
          NGC_CLI_API_KEY: ${{ secrets.AIRE_NGC_SERVICE_KEY }}
          NGC_CLI_ORG: "0921617854601259"
          NGC_CLI_TEAM: nemo-compass
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          WHEEL_FILE: ${{ steps.artifacts.outputs.wheel }}
        working-directory: dist
        run: |
          : "${NGC_CLI_API_KEY:?AIRE_NGC_SERVICE_KEY repository secret is required}"
          resource_ref="${NGC_CLI_ORG}/${NGC_CLI_TEAM}/nemo-compass:${RELEASE_TAG#v}"
          destination=$(mktemp -d)
          if ! ngc registry resource download-version "$resource_ref" --file "$WHEEL_FILE" --dest "$destination"; then
            # A retry may find that a previous upload finished despite a client error.
            ngc registry resource upload-version "$resource_ref" --source "$WHEEL_FILE" || true
            destination=$(mktemp -d)
            ngc registry resource download-version "$resource_ref" --file "$WHEEL_FILE" --dest "$destination"
          fi
          python3 - "$destination" "$WHEEL_FILE" <<'PYTHON'
          import sys
          from pathlib import Path
          destination, wheel = map(Path, sys.argv[1:])
          staged = list(destination.rglob(wheel.name))
          assert len(staged) == 1, "Expected exactly one staged wheel"
          assert staged[0].read_bytes() == wheel.read_bytes(), "NGC wheel differs from validated artifact"
          PYTHON
          printf 'Staged SDK wheel: %s\n' "$resource_ref" >> "$GITHUB_STEP_SUMMARY"
