name: Forward-port release fixes
on:
  workflow_run:
    workflows: ['Start release', CI]
    types: [requested, completed]
    branches: ['release/**', 'backport-*-to-main']
permissions:
  contents: read
concurrency:
  group: forward-port-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  forward-port:
    if: >-
      (github.event.action == 'requested' && github.event.workflow_run.name == 'Start release' &&
       github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'release/')) ||
      (github.event.action == 'completed' && github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PAT_BACKPORT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          token: ${{ secrets.PAT_BACKPORT_GITHUB_TOKEN }}
      - name: Find the merged release fix
        id: fix
        if: github.event.action == 'requested'
        run: python3 tools/forward_port.py find
      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4
        if: steps.fix.outputs.number != ''
        with:
          github_token: ${{ secrets.PAT_BACKPORT_GITHUB_TOKEN }}
          source_pr_number: ${{ steps.fix.outputs.number }}
          target_branches: main
          label_pattern: ''
          add_author_as_assignee: true
          pull_title: '[Forward-port #${pull_number}] ${pull_title}'
          experimental: '{"conflict_resolution":"draft_commit_conflicts"}'

      - name: Merge the tested forward-port
        if: github.event.action == 'completed'
        run: python3 tools/forward_port.py merge
