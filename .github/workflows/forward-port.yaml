name: Forward-port release fixes
on:
  pull_request_target:
    branches: ['release/**']
    types: [closed]
permissions:
  contents: read
concurrency:
  group: forward-port-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  forward-port:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4
        id: port
        with:
          github_token: ${{ steps.app.outputs.token }}
          target_branches: main
          label_pattern: ''
          add_author_as_assignee: true
          pull_title: '[Forward-port #${pull_number}] ${pull_title}'
          experimental: '{"conflict_resolution":"draft_commit_conflicts"}'
      - name: Enable normal auto-merge for clean forward-ports
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PULL_NUMBERS: ${{ steps.port.outputs.created_pull_numbers }}
        run: |
          for number in $PULL_NUMBERS; do
            if [ "$(gh pr view "$number" --json isDraft --jq .isDraft)" = false ]; then
              if ! gh pr merge "$number" --auto --squash; then
                gh pr comment "$number" --body 'Automatic merge could not be enabled. The assigned fix author must finish propagation under the normal repository rules.'
              fi
            fi
          done
