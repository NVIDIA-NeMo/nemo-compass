name: Forward-port release fixes
on:
  pull_request:
    branches: ['release/**']
    types: [closed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: forward-port-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  forward-port:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          token: ${{ secrets.PAT_BACKPORT_GITHUB_TOKEN }}
      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4
        id: port
        with:
          github_token: ${{ secrets.PAT_BACKPORT_GITHUB_TOKEN }}
          target_branches: main
          label_pattern: ''
          add_author_as_assignee: true
          pull_title: '[Forward-port #${pull_number}] ${pull_title}'
          experimental: '{"conflict_resolution":"draft_commit_conflicts"}'
          auto_merge_enabled: true
          auto_merge_method: squash
      - name: Approve clean forward-ports of the reviewed release fix
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBERS: ${{ steps.port.outputs.created_pull_numbers }}
        run: |
          for number in $PULL_NUMBERS; do
            if [ "$(gh pr view "$number" --json isDraft --jq .isDraft)" = false ]; then
              gh pr review "$number" --approve --body 'Automated approval: clean cherry-pick of a merged release fix. Required CI must pass before merging.'
            fi
          done
