name: Release jobs
on:
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      version:
        type: string
        default: ''
      commit:
        type: string
        default: ''
      candidate:
        type: string
        default: ''
    secrets:
      AIRE_NGC_SERVICE_KEY:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: compass-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      branch: ${{ steps.plan.outputs.branch }}
      version: ${{ steps.plan.outputs.version }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: true
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 tools/release.py plan
  validate:
    needs: plan
    uses: ./.github/workflows/ci.yaml
    with:
      release-ref: ${{ needs.plan.outputs.source }}
      release-version: ${{ needs.plan.outputs.version }}
  draft-release:
    name: Store validated artifacts and publish when requested
    needs: [plan, validate, stage-ngc]
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      (needs.plan.outputs.action != 'publish' || needs.stage-ngc.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Verify and store artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.validate.outputs.commit }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          ACTION: ${{ needs.plan.outputs.action }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 tools/release.py finish

  stage-ngc:
    name: Stage SDK wheel in NGC
    needs: [plan, validate]
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist

      - name: Verify release artifacts
        id: artifacts
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          wheels=(*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"

      - name: Install NGC CLI
        env:
          NGC_CLI_URL: https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/4.36.6/files/ngccli_linux.zip
          NGC_CLI_SHA256: 2972dbe54e80cedae18e82923a9a67a60aef23d041c5790336f8f4b51752bab6
        run: |
          curl --fail --location --silent --show-error "$NGC_CLI_URL" --output "$RUNNER_TEMP/ngccli.zip"
          echo "$NGC_CLI_SHA256  $RUNNER_TEMP/ngccli.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/ngccli.zip" -d "$RUNNER_TEMP/ngc"
          chmod +x "$RUNNER_TEMP/ngc/ngc-cli/ngc"
          echo "$RUNNER_TEMP/ngc/ngc-cli" >> "$GITHUB_PATH"

      - name: Stage and verify SDK wheel in NGC
        env:
          NGC_CLI_API_KEY: ${{ secrets.AIRE_NGC_SERVICE_KEY }}
          NGC_CLI_ORG: "0921617854601259"
          NGC_CLI_TEAM: nemo-compass
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          WHEEL_FILE: ${{ steps.artifacts.outputs.wheel }}
        working-directory: dist
        run: |
          : "${NGC_CLI_API_KEY:?AIRE_NGC_SERVICE_KEY repository secret is required}"
          resource_ref="${NGC_CLI_ORG}/${NGC_CLI_TEAM}/nemo-compass:${RELEASE_TAG#v}"
          ngc registry resource upload-version "$resource_ref" --source "$WHEEL_FILE"
          destination=$(mktemp -d)
          ngc registry resource download-version "$resource_ref" --file "$WHEEL_FILE" --dest "$destination"
          staged=$(find "$destination" -type f -name "$WHEEL_FILE")
          cmp -- "$WHEEL_FILE" "$staged"
          {
            printf 'Final wheel for nSpect: %s\nFile: %s\n' "$resource_ref" "$WHEEL_FILE"
            sha256sum -- "$WHEEL_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
