name: Start release
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      version:
        description: Final version, e.g. 0.3.0
        type: string
        required: true
      commit:
        description: Full main SHA (blank means main at dispatch)
        type: string
permissions:
  contents: write
  actions: read
jobs:
  release:
    uses: ./.github/workflows/release.yaml
    with:
      action: ${{ github.event_name == 'push' && 'candidate' || 'start' }}
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
