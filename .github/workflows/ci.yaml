name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release-ref:
        description: Commit to validate and prepare for release
        type: string
        default: ""
    outputs:
      commit:
        value: ${{ jobs.quality.outputs.commit }}
      tag:
        value: ${{ jobs.quality.outputs.tag }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release-ref || github.ref }}
  cancel-in-progress: ${{ inputs.release-ref == '' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release-ref || github.sha }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_SHA256: 777b4bb7ddd10bdcc8a1aa398d37d05e91e866e7586f9cff3fca2f72b8153033
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.3.3/osv-scanner_linux_amd64
        run: |
          curl --fail --location --silent --show-error "$OSV_SCANNER_URL" --output "$RUNNER_TEMP/osv-scanner"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check copyright headers
        run: uv run --locked python tools/check_copyright_headers.py

      - name: Check third-party licenses
        run: uv run --locked python tools/generate_third_party_licenses.py --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked ty check

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: uv run --locked pytest

      - name: Build distribution
        run: uv build --sdist --wheel --no-sources

      - name: Check distributions
        run: uv run --locked python tools/check_distribution_licenses.py

      - name: Install application wheel in a clean environment
        run: |
          smoke_env="$(mktemp -d)"
          trap 'rm -rf "$smoke_env"' EXIT
          uv venv "$smoke_env"
          uv pip install --no-config --no-sources --python "$smoke_env/bin/python" \
            dist/nemo_compass-*.whl
          cd "$smoke_env"
          "$smoke_env/bin/python" -I -c 'from compass.traces import Trace; from trace_ingest import Trace as SharedTrace; assert Trace is SharedTrace'
          "$smoke_env/bin/compass" --help

      - name: Validate release identity and checksum artifacts
        id: release
        if: inputs.release-ref != ''
        run: |
          uv run --locked python tools/check_release.py >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Preserve validated release artifacts
        if: inputs.release-ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
