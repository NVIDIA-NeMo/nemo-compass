name: Dependency review
on:
  pull_request_target:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, 'Licensing acknowledged:') ||
        contains(github.event.changes.body.from, 'Licensing acknowledged:')))
    concurrency:
      group: dependency-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never checkout or execute PR code in this privileged workflow.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
      - name: Install pinned license scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/google/osv-scanner/releases/download/v2.3.3/osv-scanner_linux_amd64 --output "$RUNNER_TEMP/osv-scanner"
          echo "777b4bb7ddd10bdcc8a1aa398d37d05e91e866e7586f9cff3fca2f72b8153033  $RUNNER_TEMP/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Report changes and check licensing acknowledgment
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --with packaging==25.0 --with PyYAML==6.0.3 python tools/dependency_review.py
