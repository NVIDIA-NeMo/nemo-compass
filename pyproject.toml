[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nemo-compass"
version = "0.2.0"
description = "NeMo Compass trace-evidence processing with a canonical JSONL trace contract"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES.md",
    "third_party/licenses.jsonl",
    "third_party/tau-bench-LICENSE.txt",
    "third_party/NOTICES.txt",
    "third_party/license_texts/*.txt",
]
authors = [{ name = "Compass contributors" }]
keywords = ["agent-traces", "evaluation", "anomaly-detection", "tool-use"]

dependencies = [
    "nemo-compass-trace-ingest==0.2.0",
    "httpx>=0.28,<1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "jsonschema>=4.18,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings[yaml]>=2.12,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
    "litellm>=1.55,<2",
    "tokenizers>=0.21,<1",
    "nooa[tracing]>=0.0.10,<0.1",
    "rich>=14,<16",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    "openinference-instrumentation>=0.1.42,<1",
]

[project.urls]
Repository = "https://github.com/NVIDIA-NeMo/labs-nemo-compass"

[project.optional-dependencies]
# Trace-source SDKs are optional extras of nemo-compass-trace-ingest; telemetry uses the standard
# OTLP exporter. compass.telemetry imports langsmith directly when a LangSmith source is configured.
langsmith = ["nemo-compass-trace-ingest[langsmith]==0.2.0", "langsmith>=0.12,<0.13"]
mlflow = ["nemo-compass-trace-ingest[mlflow]==0.2.0"]
local-embedding = ["torch==2.13.0", "transformers==5.17.0"]
langfuse = ["nemo-compass-trace-ingest[langfuse]==0.2.0"]

[dependency-groups]
# Exercise the optional source adapters in the standard contributor and CI test environment without
# making them runtime dependencies for users of the canonical filesystem format.
dev = [
    "langfuse>=4.17,<5",
    "langsmith>=0.12,<0.13",
    "mlflow-skinny>=3.6,<4",
    "packaging>=25",
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[project.scripts]
compass = "compass.cli.main:main"

[tool.uv]
managed = true
# mlflow-skinny currently reaches databricks-sdk, which caps protobuf below 7.
# Protobuf 7.35 contains the complete ParseDict recursion-depth fix.
override-dependencies = ["protobuf>=7.35,<8"]

[tool.uv.workspace]
members = ["packages/trace-ingest"]

[tool.uv.sources]
nemo-compass-trace-ingest = { workspace = true }
# macOS wheels include MPS; other platforms only need CPU inference for this extra.
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/compass"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/pyproject.toml",
    "/src/compass",
    "/third_party",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID252", "ANN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
