<!-- Source for trace-analysis-jobs.png. Render at 2x with rsvg-convert -z 2. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">Four jobs in trace analysis</title>
  <desc id="desc">Describe behavior, detect issues, diagnose failures, and prioritize improvement. Then test a change against offline evals and later production traces, and repeat.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20292e; }
      .heading { font-size: 22px; font-weight: 700; }
      .detail { font-size: 18px; fill: #46545d; }
      .node { fill: #f1f7f9; stroke: #cfdee4; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1100" height="440" rx="12" fill="#fff"/>

  <rect x="20" y="20" width="520" height="125" rx="10" class="node"/>
  <text x="43" y="60" class="heading">Describe</text>
  <text x="43" y="93" class="detail">Tasks, paths, tool use, and cost</text>

  <rect x="560" y="20" width="520" height="125" rx="10" class="node"/>
  <text x="583" y="60" class="heading">Detect</text>
  <text x="583" y="93" class="detail">Known failures and unexpected patterns</text>

  <rect x="20" y="160" width="520" height="125" rx="10" class="node"/>
  <text x="43" y="200" class="heading">Diagnose</text>
  <text x="43" y="233" class="detail">Failing steps and possible causes</text>

  <rect x="560" y="160" width="520" height="125" rx="10" class="node"/>
  <text x="583" y="200" class="heading">Prioritize</text>
  <text x="583" y="233" class="detail">Scope, impact, and fixability</text>

  <rect x="20" y="300" width="1060" height="120" rx="10" fill="#e6efcc" stroke="#a8bd76" stroke-width="1.5"/>
  <text x="43" y="342" class="heading">Then: Test a change</text>
  <text x="43" y="376" class="detail">Compare offline evals and later production traces, then repeat the process.</text>
</svg>
