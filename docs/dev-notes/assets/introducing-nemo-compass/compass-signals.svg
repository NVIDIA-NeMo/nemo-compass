<!-- Source for compass-signals.png. Render at 2x with rsvg-convert -z 2. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">Compass Signals from traces to insights</title>
  <desc id="desc">Normalized agent traces feed five current Compass Signals: Tool Issues, User Sentiment, Grader Failures, Ethos Divergence, and Anomalies and Patterns. Candidate issues are reviewed, merged, and ranked as insights with trace references. Cost Efficiency and Safety are possible future signals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#587400"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #20292e; }
      .heading { font-size: 22px; font-weight: 700; }
      .detail { font-size: 18px; fill: #46545d; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #527d00; }
      .node { fill: #fff; stroke: #ccd5d9; stroke-width: 1.5; }
      .flow { fill: none; stroke: #587400; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="820" rx="12" fill="#fff"/>

  <rect x="20" y="20" width="1060" height="125" rx="10" fill="#f1f7f9" stroke="#cfdee4" stroke-width="1.5"/>
  <text x="45" y="60" class="heading">INPUT: Normalized agent traces</text>
  <text x="45" y="94" class="detail">With scores, feedback, and written requirements when available</text>
  <path d="M550 145 V180" class="flow"/>

  <rect x="20" y="185" width="1060" height="336" rx="12" fill="#f1f7f9"/>
  <text x="45" y="219" class="eyebrow">FIVE COMPASS SIGNALS</text>

  <rect x="45" y="238" width="490" height="81" rx="8" class="node"/>
  <text x="65" y="269" class="heading">Tool Issues</text>
  <text x="65" y="298" class="detail">Deterministic checks of calls, results, and retries</text>

  <rect x="565" y="238" width="490" height="81" rx="8" class="node"/>
  <text x="585" y="269" class="heading">User Sentiment</text>
  <text x="585" y="298" class="detail">Embedding screen, then contextual review</text>

  <rect x="45" y="331" width="490" height="81" rx="8" class="node"/>
  <text x="65" y="362" class="heading">Grader Failures</text>
  <text x="65" y="391" class="detail">Recorded scores guide trace investigation</text>

  <rect x="565" y="331" width="490" height="81" rx="8" class="node"/>
  <text x="585" y="362" class="heading">Ethos Divergence</text>
  <text x="585" y="391" class="detail">Compare behavior with business requirements</text>

  <rect x="45" y="424" width="1010" height="75" rx="8" class="node"/>
  <text x="65" y="454" class="heading">Anomalies and Patterns</text>
  <text x="65" y="482" class="detail">Statistical outliers, trajectories, and failure signatures</text>

  <path d="M550 521 V556" class="flow"/>
  <rect x="20" y="561" width="1060" height="100" rx="10" fill="#e6efcc" stroke="#a8bd76" stroke-width="1.5"/>
  <text x="45" y="600" class="heading">OUTPUT: Merged insights</text>
  <text x="45" y="634" class="detail">Review candidates; merge related issues; rank findings with trace references</text>

  <text x="20" y="702" class="eyebrow">POSSIBLE FUTURE SIGNALS</text>
  <rect x="20" y="718" width="520" height="82" rx="10" fill="#f5f8ed" stroke="#dbe4c7" stroke-width="1.5"/>
  <text x="42" y="749" class="heading">Cost Efficiency</text>
  <text x="42" y="778" class="detail">What leads to excess token costs?</text>

  <rect x="560" y="718" width="520" height="82" rx="10" fill="#f5f8ed" stroke="#dbe4c7" stroke-width="1.5"/>
  <text x="582" y="749" class="heading">Safety</text>
  <text x="582" y="778" class="detail">Where might an agent take dangerous action?</text>
</svg>
